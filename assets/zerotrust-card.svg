<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .card-bg {
        fill: #0D1117;
        rx: 14px;
        ry: 14px;
        stroke: #30363D;
        stroke-width: 1.5px;
      }

      .icon-bg {
        fill: rgba(126, 231, 135, 0.08);
        stroke: rgba(126, 231, 135, 0.25);
        stroke-width: 1px;
        rx: 12px;
      }

      .title {
        font-family: 'Inter', sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #F0F6FC;
      }

      .tag-category {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #7EE787;
        letter-spacing: 0.5px;
      }

      .description {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #8B949E;
        line-height: 1.5;
      }

      .tech-pill {
        fill: #161B22;
        stroke: #30363D;
        stroke-width: 1px;
        rx: 6px;
      }

      .tech-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 500;
        fill: #58A6FF;
      }

      .btn-github {
        fill: rgba(88, 166, 255, 0.1);
        stroke: #58A6FF;
        stroke-width: 1px;
        rx: 8px;
      }

      .btn-text {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #F0F6FC;
      }

      .feature-dot {
        fill: #7EE787;
      }

      .feature-text {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        fill: #F0F6FC;
      }
    </style>

    <linearGradient id="ztGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EE787" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- Main Card Container -->
  <rect width="880" height="220" class="card-bg" />
  <rect width="880" height="220" rx="14" ry="14" fill="url(#ztGlow)" />

  <!-- Left Icon Container -->
  <g transform="translate(32, 32)">
    <rect width="64" height="64" class="icon-bg" />
    <!-- Zero Trust Lock Keyhole & Radar Icon -->
    <circle cx="32" cy="32" r="18" fill="none" stroke="#7EE787" stroke-width="2" />
    <path d="M 32 22 V 32 L 38 38" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" />
    <rect x="27" y="30" width="10" height="12" rx="2" fill="#7EE787" />
    <circle cx="32" cy="34" r="1.5" fill="#0D1117" />
  </g>

  <!-- Title & Category Header -->
  <g transform="translate(116, 36)">
    <text class="tag-category">ZERO TRUST ARCHITECTURE &amp; SOC MONITORING</text>
    <text y="28" class="title">Zero Trust Examination Platform</text>
  </g>

  <!-- Top Right Status Badge -->
  <g transform="translate(730, 32)">
    <rect width="118" height="28" class="tech-pill" />
    <circle cx="16" cy="14" r="4" class="feature-dot" />
    <text x="28" y="18" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7EE787" font-weight="600">ENTERPRISE</text>
  </g>

  <!-- Description Body -->
  <g transform="translate(116, 96)">
    <text class="description">
      <tspan x="0" y="0">Secure, identity-aware examination infrastructure built on Zero Trust parameters—never trust, always verify.</tspan>
      <tspan x="0" y="22">Integrates active continuous authentication, anomaly detection, and a real-time SOC monitoring dashboard.</tspan>
    </text>
  </g>

  <!-- Feature Highlights Row -->
  <g transform="translate(116, 160)">
    <!-- Feature 1 -->
    <circle cx="6" cy="8" r="3.5" class="feature-dot" />
    <text x="16" y="12" class="feature-text">Identity-Aware Auth</text>

    <!-- Feature 2 -->
    <circle cx="186" cy="8" r="3.5" class="feature-dot" />
    <text x="196" y="12" class="feature-text">Secure Examination</text>

    <!-- Feature 3 -->
    <circle cx="356" cy="8" r="3.5" class="feature-dot" />
    <text x="366" y="12" class="feature-text">SOC Dashboard</text>
  </g>

  <!-- Tech Stack Pills & GitHub Link Button (Bottom Right) -->
  <g transform="translate(430, 150)">
    <!-- Tech Pills -->
    <g transform="translate(0, 0)">
      <rect width="65" height="28" class="tech-pill" />
      <text x="32.5" y="18" class="tech-text" text-anchor="middle">React</text>
    </g>
    <g transform="translate(73, 0)">
      <rect width="75" height="28" class="tech-pill" />
      <text x="37.5" y="18" class="tech-text" text-anchor="middle">Node.js</text>
    </g>
    <g transform="translate(156, 0)">
      <rect width="75" height="28" class="tech-pill" />
      <text x="37.5" y="18" class="tech-text" text-anchor="middle">Express</text>
    </g>
    <g transform="translate(239, 0)">
      <rect width="80" height="28" class="tech-pill" />
      <text x="40" y="18" class="tech-text" text-anchor="middle">MongoDB</text>
    </g>

    <!-- GitHub Link Button -->
    <g transform="translate(327, 0)">
      <rect width="105" height="28" class="btn-github" />
      <!-- GitHub Icon -->
      <path d="M 14 8 C 9.58 8 6 11.58 6 16 C 6 19.54 8.3 22.53 11.49 23.59 C 11.84 23.65 11.97 23.44 11.97 23.25 C 11.97 23.08 11.96 22.53 11.96 21.84 C 10 22.21 9.47 21.03 9.32 20.6 C 9.23 20.38 8.88 19.74 8.57 19.57 C 8.32 19.43 7.96 19.1 8.56 19.09 C 9.12 19.08 9.52 19.6 9.65 19.81 C 10.29 20.89 11.32 20.58 11.73 20.39 C 11.79 19.93 11.98 19.61 12.18 19.43 C 10.43 19.23 8.6 18.55 8.6 15.54 C 8.6 14.68 8.9 13.98 9.4 13.43 C 9.32 13.23 9.05 12.42 9.48 11.33 C 9.48 11.33 10.14 11.12 11.97 12.36 C 12.6 12.18 13.28 12.09 13.96 12.09 C 14.64 12.09 15.32 12.18 15.95 12.36 C 17.78 11.11 18.44 11.33 18.44 11.33 C 18.87 12.42 18.6 13.23 18.52 13.43 C 19.02 13.98 19.32 14.67 19.32 15.54 C 19.32 18.56 17.48 19.23 15.73 19.43 C 15.99 19.66 16.22 20.1 16.22 20.78 C 16.22 21.76 16.21 22.55 16.21 22.79 C 16.21 22.98 16.34 23.2 16.69 23.13 C 19.88 22.07 22.18 19.07 22.18 15.54 C 22.18 11.02 18.6 7.44 14.08 7.44 Z" fill="#F0F6FC" />
      <text x="35" y="19" class="btn-text">Code</text>
    </g>
  </g>
</svg>
