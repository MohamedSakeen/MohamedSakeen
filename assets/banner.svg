<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      * { box-sizing: border-box; }

      .bg-rect {
        fill: #0D1117;
        rx: 16px;
        ry: 16px;
        stroke: #30363D;
        stroke-width: 1.5px;
      }

      .grid-pattern {
        stroke: #161B22;
        stroke-width: 1px;
        opacity: 0.5;
      }

      /* Decryption keyframes - Optimized step toggles for zero lag */
      .t0 { animation: s0 8s infinite step-end; }
      .t1 { animation: s1 8s infinite step-end; }
      .t2 { animation: s2 8s infinite step-end; }
      .t3 { animation: s3 8s infinite step-end; }
      .t4 { animation: s4 8s infinite step-end; }
      .t5 { animation: s5 8s infinite step-end; }
      .tFinal { animation: sFinal 8s infinite step-end; }

      @keyframes s0 { 0% { opacity: 1; } 4% { opacity: 0; } }
      @keyframes s1 { 0%, 4% { opacity: 0; } 4% { opacity: 1; } 8% { opacity: 0; } }
      @keyframes s2 { 0%, 8% { opacity: 0; } 8% { opacity: 1; } 12% { opacity: 0; } }
      @keyframes s3 { 0%, 12% { opacity: 0; } 12% { opacity: 1; } 16% { opacity: 0; } }
      @keyframes s4 { 0%, 16% { opacity: 0; } 16% { opacity: 1; } 22% { opacity: 0; } }
      @keyframes s5 { 0%, 22% { opacity: 0; } 22% { opacity: 1; } 28% { opacity: 0; } }
      @keyframes sFinal { 0%, 28% { opacity: 0; } 28%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }

      .sub-text {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #8B949E;
        opacity: 0;
        animation: subFade 8s infinite linear;
      }

      @keyframes subFade {
        0%, 28% { opacity: 0; }
        35%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      .tag-row {
        opacity: 0;
        animation: tagFade 8s infinite linear;
      }

      @keyframes tagFade {
        0%, 35% { opacity: 0; }
        42%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }

      .cursor-line {
        stroke: #00D4FF;
        stroke-width: 3px;
        animation: blink 0.7s infinite alternate step-start;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .status-pill {
        fill: rgba(88, 166, 255, 0.08);
        stroke: rgba(88, 166, 255, 0.25);
        stroke-width: 1px;
        rx: 12px;
      }
    </style>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#58A6FF" />
    </linearGradient>

    <radialGradient id="cornerGlow" cx="10%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" class="grid-pattern" />
    </pattern>
  </defs>

  <!-- Main Background Container -->
  <rect width="920" height="280" class="bg-rect" />
  <rect width="920" height="280" rx="16" ry="16" fill="url(#cornerGlow)" />
  <rect width="920" height="280" fill="url(#grid)" rx="16" ry="16" />

  <!-- Top Right Status Badge -->
  <g transform="translate(660, 32)">
    <rect width="228" height="28" class="status-pill" />
    <circle cx="16" cy="14" r="4" fill="#7EE787" />
    <text x="28" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#58A6FF">SOC &amp; DEFENSIVE SECURITY</text>
  </g>

  <!-- Security Tag Header -->
  <g transform="translate(48, 48)">
    <rect width="112" height="24" rx="6" fill="rgba(0, 212, 255, 0.08)" stroke="rgba(0, 212, 255, 0.25)" stroke-width="1" />
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#00D4FF">SEC_ENGINEER</text>
  </g>

  <!-- Decryption Name Sequence (Optimized & Non-Laggy) -->
  <g transform="translate(48, 125)">
    <!-- Stage 0: M0 -->
    <g class="t0">
      <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="42" fill="#00D4FF">M0</text>
      <line x1="60" y1="-32" x2="60" y2="6" class="cursor-line" />
    </g>

    <!-- Stage 1: M0h -->
    <g class="t1">
      <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="42" fill="#00D4FF">M0h</text>
      <line x1="86" y1="-32" x2="86" y2="6" class="cursor-line" />
    </g>

    <!-- Stage 2: M0h4 -->
    <g class="t2">
      <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="42" fill="#00D4FF">M0h4</text>
      <line x1="112" y1="-32" x2="112" y2="6" class="cursor-line" />
    </g>

    <!-- Stage 3: M0h4m3d -->
    <g class="t3">
      <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="42" fill="#00D4FF">M0h4m3d</text>
      <line x1="190" y1="-32" x2="190" y2="6" class="cursor-line" />
    </g>

    <!-- Stage 4: M0h4m3d S4k33n -->
    <g class="t4">
      <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="42" fill="#00D4FF">M0h4m3d S4k33n</text>
      <line x1="370" y1="-32" x2="370" y2="6" class="cursor-line" />
    </g>

    <!-- Stage 5: Decrypting transition -->
    <g class="t5">
      <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="42" fill="#58A6FF">Moham3d Sak3en</text>
      <line x1="370" y1="-32" x2="370" y2="6" class="cursor-line" />
    </g>

    <!-- Final Stage: Mohamed Sakeen -->
    <g class="tFinal">
      <text font-family="'JetBrains Mono', monospace" font-weight="700" font-size="42" fill="url(#titleGradient)" letter-spacing="-0.5">Mohamed Sakeen</text>
      <line x1="372" y1="-32" x2="372" y2="6" class="cursor-line" />
    </g>
  </g>

  <!-- Subtitle -->
  <g transform="translate(48, 172)" class="sub-text">
    <text x="0" y="0">Cybersecurity Engineering Student</text>
  </g>

  <!-- Tags Row -->
  <g transform="translate(48, 202)" class="tag-row">
    <rect x="0" y="0" width="60" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="30" y="17" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#F0F6FC" text-anchor="middle">SOC</text>

    <rect x="70" y="0" width="145" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="142.5" y="17" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#F0F6FC" text-anchor="middle">Threat Detection</text>

    <rect x="225" y="0" width="95" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="272.5" y="17" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#F0F6FC" text-anchor="middle">Zero Trust</text>

    <rect x="330" y="0" width="145" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="402.5" y="17" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#7EE787" text-anchor="middle">Defensive Security</text>
  </g>
</svg>
