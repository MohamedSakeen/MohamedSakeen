<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');

      .footer-card {
        fill: #0D1117;
        rx: 16px;
        ry: 16px;
        stroke: #30363D;
        stroke-width: 1.5px;
      }

      .philosophy-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 600;
      }

      .step-learn { fill: #00D4FF; }
      .step-build { fill: #58A6FF; }
      .step-break { fill: #F0F6FC; }
      .step-secure { fill: #7EE787; }
      .step-repeat { fill: #8B949E; }

      .arrow {
        fill: #30363D;
        animation: pulseArrow 2s ease-in-out infinite alternate;
      }

      @keyframes pulseArrow {
        0% { fill: #30363D; opacity: 0.5; }
        100% { fill: #00D4FF; opacity: 1; }
      }

      .footer-glow {
        filter: blur(50px);
        opacity: 0.15;
      }

      .footer-sub {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #8B949E;
        letter-spacing: 0.5px;
      }

      .brand-dot {
        fill: #7EE787;
        animation: dotGlow 2s ease-in-out infinite alternate;
      }

      @keyframes dotGlow {
        0% { opacity: 0.5; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #7EE787); }
      }
    </style>

    <radialGradient id="footerGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#7EE787" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="920" height="160" class="footer-card" />

  <!-- Ambient Glow -->
  <circle cx="460" cy="80" r="200" fill="url(#footerGlowGrad)" class="footer-glow" />

  <!-- Central Loop Sequence -->
  <g transform="translate(460, 65)" text-anchor="middle">
    <!-- Row of Philosophy Pills/Steps -->
    <g transform="translate(0, 0)">
      <!-- Learn -->
      <g transform="translate(-320, 0)">
        <rect x="-50" y="-18" width="100" height="36" rx="8" fill="rgba(0, 212, 255, 0.08)" stroke="rgba(0, 212, 255, 0.3)" stroke-width="1" />
        <text y="5" class="philosophy-text step-learn" text-anchor="middle">Learn</text>
      </g>

      <!-- Arrow 1 -->
      <text x="-240" y="5" font-family="'JetBrains Mono', monospace" font-size="16" fill="#30363D" text-anchor="middle">→</text>

      <!-- Build -->
      <g transform="translate(-160, 0)">
        <rect x="-50" y="-18" width="100" height="36" rx="8" fill="rgba(88, 166, 255, 0.08)" stroke="rgba(88, 166, 255, 0.3)" stroke-width="1" />
        <text y="5" class="philosophy-text step-build" text-anchor="middle">Build</text>
      </g>

      <!-- Arrow 2 -->
      <text x="-80" y="5" font-family="'JetBrains Mono', monospace" font-size="16" fill="#30363D" text-anchor="middle">→</text>

      <!-- Break -->
      <g transform="translate(0, 0)">
        <rect x="-50" y="-18" width="100" height="36" rx="8" fill="rgba(240, 246, 252, 0.06)" stroke="rgba(240, 246, 252, 0.2)" stroke-width="1" />
        <text y="5" class="philosophy-text step-break" text-anchor="middle">Break</text>
      </g>

      <!-- Arrow 3 -->
      <text x="80" y="5" font-family="'JetBrains Mono', monospace" font-size="16" fill="#30363D" text-anchor="middle">→</text>

      <!-- Secure -->
      <g transform="translate(160, 0)">
        <rect x="-55" y="-18" width="110" height="36" rx="8" fill="rgba(126, 231, 135, 0.08)" stroke="rgba(126, 231, 135, 0.3)" stroke-width="1" />
        <text y="5" class="philosophy-text step-secure" text-anchor="middle">Secure</text>
      </g>

      <!-- Arrow 4 -->
      <text x="240" y="5" font-family="'JetBrains Mono', monospace" font-size="16" fill="#30363D" text-anchor="middle">→</text>

      <!-- Repeat -->
      <g transform="translate(320, 0)">
        <rect x="-50" y="-18" width="100" height="36" rx="8" fill="rgba(139, 148, 158, 0.1)" stroke="rgba(139, 148, 158, 0.3)" stroke-width="1" />
        <text y="5" class="philosophy-text step-repeat" text-anchor="middle">Repeat</text>
      </g>
    </g>
  </g>

  <!-- Bottom Copyright / Sub-text Line -->
  <g transform="translate(460, 125)" text-anchor="middle">
    <circle cx="-160" cy="-4" r="3" class="brand-dot" />
    <text class="footer-sub">MOHAMED SAKEEN <tspan fill="#30363D">|</tspan> CYBERSECURITY ENGINEERING &amp; DEFENSIVE SYSTEMS</text>
  </g>
</svg>
